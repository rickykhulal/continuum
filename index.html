<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="description" content="Continuum harmonizes 26 years of NASA MODIS and VIIRS fire detections into one honest, sensor-independent burning record — with a live orbital observatory." />
    <title>Continuum — The Fire Record Doctor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b0c0e'/%3E%3Cpath d='M32 10c8 8 12 14 12 22a12 12 0 0 1-24 0c0-5 2-9 6-14 1 4 3 6 6 8 0-6 0-10 0-16z' fill='%23ff8a3d'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; background: #0b0c0e; color: #f4f4f6; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: #0b0c0e; font-family: ui-monospace, monospace; text-align: center; }
      .boot p { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #f4f4f6; font-weight: 600; }
      .boot span { font-size: 12px; color: #9fa2a8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-mark { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.08); border-top-color: #ff8a3d; animation: bootspin 0.9s linear infinite; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark"></div>
        <p>Connecting to orbital telemetry</p>
        <span>Waking the server, this can take up to a minute.</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
