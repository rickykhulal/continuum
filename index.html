<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080d" />
    <meta name="description" content="Continuum harmonizes 26 years of NASA MODIS and VIIRS fire detections into one honest, sensor-independent burning record — with a live orbital observatory." />
    <title>Continuum — The Fire Record Doctor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2306080d'/%3E%3Cpath d='M32 10c8 8 12 14 12 22a12 12 0 0 1-24 0c0-5 2-9 6-14 1 4 3 6 6 8 0-6 0-10 0-16z' fill='%23ff6a3d'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; background: #04070c; color: #e9f2fa; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; background: radial-gradient(900px 600px at 50% 30%, #0b1c2b, #04070c 70%); font-family: ui-monospace, monospace; }
      .boot p { margin: 0; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #7e98b0; }
      .boot-mark { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(110,231,255,.2); border-top-color: #ff8a3d; border-right-color: #6ee7ff; animation: bootspin 1.1s linear infinite; box-shadow: 0 0 40px rgba(110,231,255,.16); }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark"></div>
        <p>Establishing orbital link…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
